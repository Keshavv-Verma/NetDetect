[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[server]
port = 8501
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50

[theme]
base = "dark"
backgroundColor = "#09090b"
secondaryBackgroundColor = "#121215"
textColor = "#fafafa"
primaryColor = "#e4e4e7"
font = "sans serif"
